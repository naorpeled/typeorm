<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep purple gradient background -->
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#6B2460"/>
      <stop offset="100%" stop-color="#1E0E30"/>
    </radialGradient>
    
    <!-- Subtle text shadow -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#backgroundGradient)"/>
  
  <!-- Bold "2025" watermark in background -->
  <text x="600" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="320" font-weight="bold" fill="#FF6B35" opacity="0.08">
    2025
  </text>
  
  <!-- Main content container - Variant 3: Matching current typography -->
  <g transform="translate(600, 315)">
    <!-- TypeORM title -->
    <text x="0" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" filter="url(#textShadow)">
      TypeORM
    </text>
    
    <!-- 2025 Recap -->
    <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FF6B35" filter="url(#textShadow)">
      2025 Recap
    </text>
  </g>
  
  <!-- Subtle accent line -->
  <rect x="500" y="410" width="200" height="3" rx="1.5" fill="#FF6B35" opacity="0.6"/>
</svg>
